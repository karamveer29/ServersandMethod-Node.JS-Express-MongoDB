
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRUD App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 40px auto;
            padding: 0 16px;
            background: #f4f6f9;
        }
        h1 { color: #23784b; }
        form, .student {
            background: white;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
        }
        input {
            padding: 10px;
            margin: 5px 3px 5px 0;
            max-width: 95%;
        }
        button {
            padding: 9px 12px;
            margin: 4px;
            cursor: pointer;
        }
        #message { margin: 12px 0; }
    </style>
</head>
<body>
    <h1>Student Management</h1>
    <p>Manage student data stored in MongoDB.</p>

    <form id="studentForm">
        <h3 id="formTitle">Add Student</h3>

        <input id="name" placeholder="Student name" required>
        <input id="age" type="number" min="1" placeholder="Age" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="course" placeholder="Course">

        <button type="submit" id="saveBtn">Add Student</button>
        <button type="button" id="cancelBtn" hidden>Cancel Edit</button>
    </form>

    <p id="message"></p>

    <h2>Students List</h2>
    <button onclick="loadStudents()">Refresh Data</button>
    <div id="students">Loading students...</div>

    <script>
        const API = '/api/students';
        let editingId = null;

        const form = document.getElementById('studentForm');
        const message = document.getElementById('message');
        const studentsDiv = document.getElementById('students');

        async function loadStudents() {
            studentsDiv.textContent = 'Loading...';

            try {
                const response = await fetch(API);
                if (!response.ok) throw new Error('Could not load students');

                const students = await response.json();
                studentsDiv.replaceChildren();

                if (students.length === 0) {
                    studentsDiv.textContent = 'No students found. Add one above.';
                    return;
                }

                students.forEach(student => {
                    const card = document.createElement('div');
                    card.className = 'student';

                    const details = document.createElement('p');
                    details.textContent =
                        `${student.name} | Age: ${student.age} | ` +
                        `${student.email} | Course: ${student.course || 'N/A'}`;

                    const editBtn = document.createElement('button');
                    editBtn.textContent = 'Edit';
                    editBtn.onclick = () => editStudent(student);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.onclick = () => deleteStudent(student._id);

                    card.append(details, editBtn, deleteBtn);
                    studentsDiv.appendChild(card);
                });
            } catch (error) {
                studentsDiv.textContent = error.message;
            }
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();

            const student = {
                name: document.getElementById('name').value.trim(),
                age: Number(document.getElementById('age').value),
                email: document.getElementById('email').value.trim(),
                course: document.getElementById('course').value.trim()
            };

            try {
                const response = await fetch(
                    editingId ? `${API}/${editingId}` : API,
                    {
                        method: editingId ? 'PUT' : 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(student)
                    }
                );

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Request failed');

                message.textContent = editingId
                    ? 'Student updated successfully!'
                    : 'Student added successfully!';

                form.reset();
                editingId = null;
                document.getElementById('formTitle').textContent = 'Add Student';
                document.getElementById('saveBtn').textContent = 'Add Student';
                document.getElementById('cancelBtn').hidden = true;

                await loadStudents();
            } catch (error) {
                message.textContent = error.message;
            }
        });

        function editStudent(student) {
            editingId = student._id;

            document.getElementById('name').value = student.name;
            document.getElementById('age').value = student.age;
            document.getElementById('email').value = student.email;
            document.getElementById('course').value = student.course || '';

            document.getElementById('formTitle').textContent = 'Edit Student';
            document.getElementById('saveBtn').textContent = 'Save Changes';
            document.getElementById('cancelBtn').hidden = false;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) return;

            try {
                const response = await fetch(`${API}/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Delete failed');

                message.textContent = 'Student deleted successfully!';
                await loadStudents();
            } catch (error) {
                message.textContent = error.message;
            }
        }

        document.getElementById('cancelBtn').addEventListener('click', () => {
            editingId = null;
            form.reset();
            document.getElementById('formTitle').textContent = 'Add Student';
            document.getElementById('saveBtn').textContent = 'Add Student';
            document.getElementById('cancelBtn').hidden = true;
            message.textContent = '';
        });

        loadStudents();
    </script>
</body>
</html>
